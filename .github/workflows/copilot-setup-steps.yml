name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    name: Copilot Setup Steps
    runs-on: ubuntu-latest
    steps:
      # Important: do not try to check this out to a different path - Coding Agent gets confused.
      - name: Checkout the Ed-Fi-ODS-Implementation repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Checkout the Ed-Fi-ODS repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository_owner }}/Ed-Fi-ODS
          # Note that this is checking out in the parent, which makes this a peer to Ed-Fi-ODS-Implementation.
          path: ../Ed-Fi-ODS

      - name: Install and run the Code Generation Utility
        # The working directory is automatically Ed-Fi-ODS-Implementation.
        shell: pwsh
        run: |
          ./Initialize-PowershellForDevelopment.ps1
          # Note: the repository root has an extra `Ed-Fi-ODS-Implementation` folder in the path
          Invoke-CodeGen -Engine PostgreSQL -RepositoryRoot $env:GITHUB_WORKSPACE/Ed-Fi-ODS-Implementation -StandardVersion 6.0.0 -ExtensionVersion 1.0.0

      - name: Restore NuGet packages
        run: dotnet restore ./Application/Ed-Fi-Ods.sln